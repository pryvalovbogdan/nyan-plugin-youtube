<!doctype html>
<html>
<head>
    <title>Kitty picker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="stylesheet" href="./popup.css">
</head>
<body>
    <div class="theme-toggle-container">
        <h1 class="kitty-title" id="popupTitle">Kitty selector</h1>

        <label class="switch">
            <input type="checkbox" id="themeCheckbox">
            <span class="slider"></span>
        </label>
    </div>

    <div class="lang-select-container">
        <button id="langDropdownTrigger" class="lang-dropdown-trigger">English</button>
        <div id="langDropdownMenu" class="lang-dropdown-menu"></div>
    </div>
    <div class="cat-grid-container" id="catGrid">
        <label class="cat-grid-item upload-tile-card" for="gifUploader" title="Upload your own custom GIF!">
            <div class="upload-plus-icon">+</div>
            <div class="upload-text">Upload GIF</div>
            <input type="file" id="gifUploader" accept="image/gif" style="display: none;" />
        </label>
    </div>
    <div class="custom-cat-controls" id="customCatControls">
        <div class="controls-section-header">
            <span class="controls-section-title" id="adjustPositionTitle">Adjust Position</span>
            <button class="reset-position-btn" id="resetPositionBtn">Set default position</button>
        </div>
        <div class="custom-cat-control-row">
            <span class="control-label" id="labelHeight">Height</span>
            <div class="control-slider-wrap">
                <input type="range" class="control-slider" id="heightSlider" min="8" max="80" value="28" aria-label="Height">
                <span class="control-value" id="heightValue">28</span>
                <span class="control-unit">px</span>
            </div>
        </div>
        <div class="custom-cat-control-row">
            <span class="control-label" id="labelTop">Top offset</span>
            <div class="control-slider-wrap">
                <input type="range" class="control-slider" id="topSlider" min="-50" max="20" value="-13" aria-label="Top offset">
                <span class="control-value" id="topValue">-13</span>
                <span class="control-unit">px</span>
            </div>
        </div>
    </div>
    <div class="support-button-container">
        <div class="support-button-row">
            <a href="https://nyan-progressbar.com/en/support" target="_blank" class="support-button" id="donateBtn" title="Support the project">
                Donate
            </a>
            <a href="https://nyan-progressbar.com/en/customizer" target="_blank" class="support-button" id="customizeBtn" title="Customize your cat">
                Customize
            </a>
            <a href="https://nyan-progressbar.com/" target="_blank" class="support-button" id="moreBtn" title="Learn more">
                More
            </a>
        </div>
        <div class="support-button-row">
            <a href="https://chromewebstore.google.com/detail/nyan-cat-extension/oadlabdleegopgjlkcmjjogeaceagbie/reviews" target="_blank" class="support-button support-button-rate" id="rateUsBtn" title="Rate us">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" style="flex-shrink:0"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                <span id="rateUsLabel">Rate Us</span>
            </a>
        </div>
    </div>
    <script src="./popup.js"></script>
</body>
</html>
